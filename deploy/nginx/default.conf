# Static site server. TLS, compression and the public hostname are handled by Caddy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS-terminating proxy: emit relative redirects so they keep https and the public host.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness endpoint for the container healthcheck; no external dependencies.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build assets never change; cache them for a year.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Multi-page static site (not an SPA): each route is its own index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Decap CMS configuration (generated JSON, which is valid YAML).
    location = /admin/config.yml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/yaml;
        types { }
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
