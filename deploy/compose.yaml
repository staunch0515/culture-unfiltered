# Production deployment. This is the only compose file used on the server.
# IMAGE_TAG is exported by /opt/infra/scripts/deploy-app.sh.
name: culture_unfiltered

services:
  web:
    image: ghcr.io/staunch0515/culture-unfiltered:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: culture_unfiltered-web
    restart: unless-stopped
    env_file: .env
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # busybox wget ships with the nginx-unprivileged alpine image.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      start_interval: 2s
      retries: 3
    networks:
      - proxy

networks:
  proxy:
    external: true
